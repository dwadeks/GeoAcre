trigger:
  branches:
    include:
      - main

pr:
  branches:
    include:
      - main
      - 001-land-area-estimator

pool:
  vmImage: 'ubuntu-latest'

stages:
  - stage: Test
    jobs:
      - job: Frontend
        steps:
          - checkout: self
          - task: NodeTool@0
            inputs:
              versionSpec: '20.x'
          - script: |
              cd frontend
              npm ci
              npm run lint
              npm run test -- --run
              npm run test:coverage
            displayName: Frontend checks

      - job: Backend
        steps:
          - checkout: self
          - task: UseDotNet@2
            inputs:
              packageType: 'sdk'
              version: '10.x'
          - script: |
              cd backend
              dotnet restore
              dotnet test --collect:"XPlat Code Coverage"
            displayName: Backend checks

  - stage: Deploy
    condition: and(succeeded(), eq(variables['Build.SourceBranch'], 'refs/heads/main'))
    jobs:
      - job: DeployPlaceholder
        steps:
          - script: echo "Configure Azure service connections and deployment tasks for SWA/App Service."
            displayName: Deployment placeholder
